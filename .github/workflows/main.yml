name: Build Jarvis Pro APK



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'



      - name: Generate Project & Build APK

        run: |

          mkdir -p /tmp/jarvis_project

          cd /tmp/jarvis_project

          echo "" | base64 -d > project.zip

          unzip -q -o project.zip

          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip

          unzip -q gradle.zip

          ./gradle-8.4/bin/gradle assembleDebug --no-daemon



      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: Jarvis-Pro-APK

          path: /tmp/jarvis_project/app/build/outputs/apk/debug/app-debug.apk

